spring:
  datasource:
    url: jdbc:mysql://mysql:3306/school_grades?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: SchoolRoot2024!
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT — секрет хранится как plain-string (минимум 32 символа для HS256/HS512).
# JwtTokenProvider кодирует его ОДИН РАЗ через getBytes(UTF_8),
# без какого-либо Base64-round-trip, что устраняет проблему двойного кодирования.
jwt:
  secret: "SchoolGradesJwtSecretKey2024_MustBeAtLeast256BitsLong!"
  expiration-ms: 86400000   # 24 часа

server:
  port: 8080

# Swagger UI доступен по адресу: http://localhost:8080/swagger-ui/index.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
